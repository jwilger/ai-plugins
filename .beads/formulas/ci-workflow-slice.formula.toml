formula = "ci-workflow-slice"
description = "A CI workflow change for which the pushed workflow execution is the behavioral test"
version = 1
type = "workflow"

[vars.change]
description = "CI behavior delivered by this slice"
required = true

[vars.checkpoint_target]
description = "Remote branch used to execute the CI test"
required = true

[vars.ci_workflow]
description = "GitHub Actions workflow being tested"
default = "ci.yml"

[[steps]]
id = "define-ci-behavior"
title = "Define expected CI behavior: {{change}}"
description = "State the triggering event, jobs, ordering, permissions, inputs, and observable terminal outcome that the workflow change must produce."

[[steps]]
id = "edit-workflow"
title = "Make the smallest CI workflow change"
needs = ["define-ci-behavior"]
description = "Change only the workflow and directly coupled support files needed for the expected CI behavior."

[[steps]]
id = "static-validation"
title = "Run available static CI validation"
needs = ["edit-workflow"]
description = "Run syntax, actionlint, expression, manifest, or dry-run checks that can execute locally. These checks are preflight validation, not a substitute for the pushed workflow run."

[[steps]]
id = "push-ci-test"
title = "Commit and push the CI test to {{checkpoint_target}}"
needs = ["static-validation"]
description = "Create a rationale-bearing commit and push it to the policy-authorized branch so the real CI system executes the change. Record the tested SHA and run URL."

[[steps]]
id = "prove-ci-behavior"
title = "Wait for the CI workflow test"
needs = ["push-ci-test"]
description = "Resolve only when the tested SHA produces the expected terminal behavior. If it fails for a causal workflow defect, return to edit-workflow, push a new tested SHA, and update the evidence. Do not create an unrelated-work recovery hold for this intentional related test cycle."

[steps.gate]
type = "gh:run"
id = "{{ci_workflow}}"
timeout = "1h"

[[steps]]
id = "record-successful-checkpoint"
title = "Record the successful CI checkpoint"
needs = ["prove-ci-behavior"]
description = "Record the exact successful SHA, workflow run, static validation, and any deliberately unsupported local checks."
