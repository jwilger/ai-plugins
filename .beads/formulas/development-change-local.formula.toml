formula = "development-change-local"
description = "Local-only development with behavior slices, green local checkpoints, verification, and final review"
version = 1
type = "workflow"

[vars.work_item]
description = "User-facing title of the work item"
required = true

[[steps]]
id = "preflight"
title = "Preflight: {{work_item}}"
description = "Confirm scope and acceptance criteria; classify affected surfaces, risks, tests, evaluations, documentation, and the explicit absence of remote delivery before editing."

[[steps]]
id = "classify-change-slices"
title = "Classify and plan change slices"
needs = ["preflight"]
description = "Split the work into independently deliverable slices and route each explicitly: behavior-slice for runtime behavior, documentation-slice for prose-only changes, ci-workflow-slice when executing CI is the behavioral test, or validation-only-slice for non-runtime configuration and metadata. Attach the selected molecules in explicit sequence."

[[steps]]
id = "complete-change-slices"
title = "Complete classified slices with verified local checkpoints"
needs = ["classify-change-slices"]
description = "Execute every attached slice molecule according to its evidence contract. Behavior slices use BDD and focused TDD; documentation and validation-only slices do not invent tests; CI workflow slices require an explicitly authorized remote test or record why local-only delivery cannot execute CI. Create local commits without pushing."

[[steps]]
id = "verify"
title = "Verify the complete local change"
needs = ["complete-change-slices"]
description = "Run fresh causally relevant verification across the complete diff, including only provider-backed evaluations the changed surfaces can affect. Record commands, outcomes, and artifact references."

[[steps]]
id = "final-review"
title = "Complete risk-proportional final review"
needs = ["verify"]
description = "Run the configured final-review process. Findings requiring code reopen implementation, attach a new behavior slice, and repeat verification before review resumes."

[[steps]]
id = "record-local-delivery"
title = "Record verified local-only delivery"
needs = ["final-review"]
description = "Record the final local commit SHA and explicitly state that no branch, pull request, or remote delivery occurred."

[[steps]]
id = "finish"
title = "Close local work"
needs = ["record-local-delivery"]
description = "Close the work item with evidence and commit local Dolt state. A linked worktree is only needed for concurrent mutable tickets; clean one up separately only when it was created solely for that isolation and is no longer in use."
