formula = "ci-recovery"
description = "Single-owner recovery from an unexpected terminal pushed-CI failure"
version = 1
type = "workflow"

[vars.failed_run]
description = "URL or stable identifier of the failed CI run"
required = true

[vars.ci_workflow]
description = "GitHub Actions workflow that must return to terminal success"
default = "ci.yml"

[[steps]]
id = "claim-hold"
title = "Claim CI recovery and acquire the merge slot"
description = "Atomically claim the recovery bead labeled development-system:ci-recovery and acquire the project merge slot. Every other session pauses unrelated guarded work."

[[steps]]
id = "capture-failure"
title = "Capture exact failed run evidence"
needs = ["claim-hold"]
description = "Record failed run {{failed_run}}, ref, SHA, workflow, job, step, and bounded relevant logs before selecting an action."

[[steps]]
id = "diagnose"
title = "Diagnose and classify the failure"
needs = ["capture-failure"]
description = "Determine the causal explanation and classify the failure as caused, unrelated, or transient. Preserve uncertainty rather than guessing."

[[steps]]
id = "choose-action"
title = "Choose the sole recovery action"
needs = ["diagnose"]
description = "Choose exactly one tested causal repair or an unchanged-SHA rerun. Helpers may inspect, reproduce, edit, or test but do not independently push or rerun."

[[steps]]
id = "execute-action"
title = "Execute the selected recovery action"
needs = ["choose-action"]
description = "Perform only the chosen action, record replacement SHA and run URL, and keep the repository-wide hold active."

[[steps]]
id = "prove-terminal-success"
title = "Wait for terminal replacement-run success"
needs = ["execute-action"]
description = "Resolve only when the exact replacement run reaches terminal success. Queued, running, canceled, and failed states do not release the hold."

[steps.gate]
type = "gh:run"
id = "{{ci_workflow}}"
timeout = "1h"

[[steps]]
id = "release-hold"
title = "Release the CI hold and merge slot"
needs = ["prove-terminal-success"]
description = "Record exact terminal-success proof, close the recovery bead, release the merge slot, commit and push Dolt state, and only then resume unrelated work."
