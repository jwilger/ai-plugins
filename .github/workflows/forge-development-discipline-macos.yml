name: Forge development-discipline macOS candidate

on:
  workflow_dispatch:
  push:
    branches:
      - "artifact-build/development-discipline/**"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  forge:
    name: Forge universal macOS binary
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build and verify universal binary
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          plugin_root="plugins/development-system/components/development-discipline"
          manifest="$plugin_root/rust/Cargo.toml"
          toolchain_file="$plugin_root/rust/rust-toolchain.toml"
          binary_name="development-discipline-mcp"
          candidate_dir="$RUNNER_TEMP/development-discipline-macos-candidate"
          export CARGO_HOME="$RUNNER_TEMP/development-discipline-cargo"
          export RUSTUP_HOME="$RUNNER_TEMP/development-discipline-rustup"
          export CARGO_TARGET_DIR="$candidate_dir/target"

          toolchain="$(awk -F'"' '/^channel = "/ { print $2; exit }' "$toolchain_file")"
          test -n "$toolchain"
          source_fingerprint="$({
            cd "$plugin_root/rust"
            sha256sum Cargo.toml Cargo.lock rust-toolchain.toml src/main.rs |
              sha256sum |
              awk '{ print $1 }'
          })"
          export DEVELOPMENT_DISCIPLINE_SOURCE_FINGERPRINT="$source_fingerprint"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          clang="$(xcrun --sdk macosx --find clang)"
          export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER="$clang"
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="$clang"

          mkdir -p "$candidate_dir" "$CARGO_HOME" "$RUSTUP_HOME"
          if ! rustup toolchain list | grep -Eq "^${toolchain}(-| )"; then
            rustup toolchain install "$toolchain" --profile minimal
          fi
          rustup target add \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            --toolchain "$toolchain"

          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            rustup run "$toolchain" cargo build \
              --locked \
              --release \
              --manifest-path "$manifest" \
              --bin "$binary_name" \
              --target "$target"
          done

          universal_binary="$candidate_dir/$binary_name"
          xcrun lipo -create \
            "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/$binary_name" \
            "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/$binary_name" \
            -output "$universal_binary"
          chmod 0755 "$universal_binary"

          file_output="$(file "$universal_binary")"
          echo "$file_output"
          grep -Fq "x86_64" <<<"$file_output"
          grep -Fq "arm64" <<<"$file_output"
          grep -aFq -- "$source_fingerprint" "$universal_binary"

          binary_sha256="$(sha256sum "$universal_binary" | awk '{ print $1 }')"
          envelope="$candidate_dir/candidate.json"
          jq -n \
            --arg candidate_full_sha "$GITHUB_SHA" \
            --arg source_fingerprint "$source_fingerprint" \
            --arg universal_binary_sha256 "$binary_sha256" \
            --arg rust_toolchain "$toolchain" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg runner_name "$RUNNER_NAME" \
            --arg runner_environment "$RUNNER_ENVIRONMENT" \
            --arg image_os "${ImageOS:-}" \
            --arg image_version "${ImageVersion:-}" \
            --arg macos_version "$(sw_vers -productVersion)" \
            --arg xcode_version "$(xcodebuild -version | paste -sd ' ' -)" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            '{
              candidate_full_sha: $candidate_full_sha,
              source_fingerprint: $source_fingerprint,
              universal_binary_sha256: $universal_binary_sha256,
              rust_toolchain: $rust_toolchain,
              runner: {
                os: $runner_os,
                arch: $runner_arch,
                name: $runner_name,
                environment: $runner_environment,
                image_os: $image_os,
                image_version: $image_version,
                macos_version: $macos_version,
                xcode_version: $xcode_version
              },
              workflow_run_id: $workflow_run_id
            }' >"$envelope"

          printf 'FORGE_BINARY_PATH=%s\n' "$universal_binary" >>"$GITHUB_ENV"
          printf 'FORGE_ENVELOPE_PATH=%s\n' "$envelope" >>"$GITHUB_ENV"

      - name: Attest raw universal binary
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.FORGE_BINARY_PATH }}

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: development-discipline-macos-${{ github.sha }}
          path: |
            ${{ env.FORGE_BINARY_PATH }}
            ${{ env.FORGE_ENVELOPE_PATH }}
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
