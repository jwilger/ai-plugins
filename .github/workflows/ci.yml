name: CI

# Public repo: pull_request is reachable from forks, so every job below stays
# on GitHub-hosted Ubuntu runners. Direct pushes to trunk run the same gate,
# and merge_group preserves coverage for repositories that opt into PR mode.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Cancel only an older revision of the same delivery stream. Event type keeps
# main pushes, pull requests, and merge-queue validation isolated; ref keeps
# separate pull requests and merge groups from canceling one another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.lane }})
    # Ubuntu 24.04's AppArmor policy strips capabilities from unprivileged user
    # namespaces used by the retained review-replay sandbox tests.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: static
            commands: validate-marketplace github-actions hyprland-computer-control pi-extension
          - lane: tiber
            commands: tiber-rust tiber-dashboard-smoke
            rust-workspaces: plugins/development-system/components/tiber/rust -> ../../../../../target/tiber-plugin
          - lane: discipline
            commands: development-discipline-rust
            rust-workspaces: plugins/development-system/components/development-discipline/rust -> ../../../../../target
          - lane: mutants
            commands: tiber-mutants
            rust-workspaces: plugins/development-system/components/tiber/rust -> ../../../../../target/mutants
          - lane: checkpoints
            commands: bats-checkpoints
          - lane: startup
            commands: bats-startup
            rust-workspaces: |
              plugins/development-system/components/tiber/rust -> ../../../../../target/tiber
              plugins/development-system/components/development-discipline/rust -> ../../../../../target/development-discipline
          - lane: shell
            commands: bats-other
    env:
      # Match flake.nix; the cache action runs outside the devshell.
      CARGO_HOME: ${{ github.workspace }}/.dependencies/cargo
      CARGO_MUTANTS_TARGET_DIR: ${{ github.workspace }}/target/mutants
      # The installer otherwise builds releases in each test's disposable home.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Cache metadata runs from each Cargo workspace. Avoid running the
      # shellHook there: it prints banners and derives cache paths from $PWD.
      - name: Expose Nix toolchain for cache metadata
        if: matrix.rust-workspaces != ''
        run: |
          nix develop -c bash <<'EOF'
          for tool in cargo rustc rustdoc; do
            dirname "$(command -v "$tool")"
          done >> "$GITHUB_PATH"
          EOF

      - name: Cache Rust dependencies and build artifacts
        if: matrix.rust-workspaces != ''
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.lane }}-${{ hashFiles('flake.lock') }}
          workspaces: ${{ matrix.rust-workspaces }}
          cache-bin: false
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache npm downloads
        if: matrix.lane == 'static' || matrix.lane == 'tiber' || matrix.lane == 'shell'
        uses: actions/cache@v4
        with:
          path: .dependencies/npm-cache
          key: npm-downloads-${{ runner.os }}-${{ hashFiles('flake.lock', 'package-lock.json', 'plugins/**/package-lock.json') }}
          restore-keys: npm-downloads-${{ runner.os }}-

      - name: Run required deterministic checks
        run: nix develop -c just ${{ matrix.commands }}

  codex-manifests:
    name: Codex manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Structural check: every Codex manifest is valid. Full `codex`-CLI
      # runtime verification runs where a Codex login is available.
      - name: Codex manifests are valid JSON
        run: |
          nix develop -c bash -c '
            jq empty .agents/plugins/marketplace.json
            find plugins -path "*/plugin.json" -exec jq empty {} \;
          '

  eval-config:
    name: Eval config dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Validate provider-backed eval configuration
        run: |
          nix develop -c scripts/evals/run.sh --dry-run
          nix develop -c scripts/evals/run.sh --suite canary --dry-run

  # Single aggregate status: succeeds only when every required job did.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [quality, codex-manifests, eval-config]
    if: always()
    steps:
      - name: Require all required jobs to have succeeded
        run: |
          required="${{ needs.quality.result }} ${{ needs.codex-manifests.result }} ${{ needs.eval-config.result }}"
          echo "required job results: $required"
          for result in $required; do
            if [ "$result" != "success" ]; then
              echo "a required job did not succeed: $result"
              exit 1
            fi
          done
