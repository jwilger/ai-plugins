assert_lefthook_installed: true
no_auto_install: true

pre-commit:
  jobs:
    - name: reject-local-codex-config
      run: |
        if ! git diff --cached --quiet -- .codex/config.toml; then
          echo '.codex/config.toml is generated machine-local configuration and must not be committed.' >&2
          exit 1
        fi
    - name: developer-gate
      run: just pre-commit

post-checkout:
  jobs:
    - name: worktree-bootstrap
      run: scripts/worktree-bootstrap.sh
