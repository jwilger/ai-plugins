formula = "development-change-pr"
description = "Pull-request development with behavior slices, green branch checkpoints, final review, approval, merge, and terminal CI proof"
version = 1
type = "workflow"

[vars.work_item]
description = "User-facing title of the work item"
required = true

[vars.ci_workflow]
description = "GitHub Actions workflow used for post-merge CI proof"
default = "ci.yml"

[[steps]]
id = "preflight"
title = "Preflight: {{work_item}}"
description = "Confirm scope and acceptance criteria; classify affected surfaces, risks, tests, evaluations, documentation, and delivery constraints before editing."

[[steps]]
id = "classify-change-slices"
title = "Classify and plan change slices"
needs = ["preflight"]
description = "Split the work into independently deliverable slices and route each explicitly: behavior-slice for runtime behavior, documentation-slice for prose-only changes, ci-workflow-slice when pushed CI is the behavioral test, or validation-only-slice for non-runtime configuration and metadata. Attach the selected molecules in explicit sequence."

[[steps]]
id = "complete-change-slices"
title = "Complete classified slices with verified checkpoints"
needs = ["classify-change-slices"]
description = "Execute every attached slice molecule according to its evidence contract. Behavior slices use BDD and focused TDD; documentation and validation-only slices do not invent tests; CI workflow slices use the pushed workflow run as their behavioral test. Push each completed checkpoint to the feature branch."

[[steps]]
id = "verify"
title = "Verify the complete change"
needs = ["complete-change-slices"]
description = "Run fresh causally relevant verification across the complete diff, including only provider-backed evaluations the changed surfaces can affect. Record commands, outcomes, and artifact references."

[[steps]]
id = "final-review"
title = "Complete risk-proportional final review"
needs = ["verify"]
description = "Run the configured final-review process. Findings requiring code reopen implementation, attach a new behavior slice, and repeat verification before review resumes."

[[steps]]
id = "open-pull-request"
title = "Open or update the pull request"
needs = ["final-review"]
description = "Push the exact reviewed SHA, open or update the pull request, and record its URL on the work item."

[[steps]]
id = "prove-pr-ci"
title = "Prove pull-request CI success"
needs = ["open-pull-request"]
description = "Resolve only after required pull-request checks for the exact reviewed SHA reach terminal success. A failure pours the ci-recovery workflow."

[[steps]]
id = "approval"
title = "Obtain required pull-request approval"
needs = ["prove-pr-ci"]
description = "Wait for the repository's required human approval without treating agent review as approval."

[steps.gate]
type = "human"

[[steps]]
id = "merge"
title = "Merge the approved pull request"
needs = ["approval"]
description = "Merge through the repository's configured merge path and record the resulting trunk SHA."

[[steps]]
id = "prove-post-merge-ci"
title = "Wait for terminal post-merge CI success"
needs = ["merge"]
description = "Resolve only after the resulting trunk SHA reaches terminal success. A failure pours the ci-recovery workflow and creates the repository-wide recovery hold."

[steps.gate]
type = "gh:run"
id = "{{ci_workflow}}"
timeout = "1h"

[[steps]]
id = "finish"
title = "Close work"
needs = ["prove-post-merge-ci"]
description = "Close the work item with evidence and commit and push Dolt state. A linked worktree is only needed for concurrent mutable tickets; clean one up separately only when it was created solely for that isolation and is no longer in use."
