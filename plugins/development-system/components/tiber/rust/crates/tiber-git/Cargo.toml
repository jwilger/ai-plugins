[package]
name = "tiber-git"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eventcore = "1.0.2"
eventcore-fs = "1.0.2"
eventcore-types = "1.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiber-core = { path = "../tiber-core" }
tokio = { version = "1", features = ["sync"] }
toml = "0.8"

[lib]
path = "src/lib.rs"

[dev-dependencies]
eventcore-testing = "1.0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
