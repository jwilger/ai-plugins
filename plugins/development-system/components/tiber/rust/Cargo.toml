[package]
name = "tiber"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
eventcore = "1.0.1"
eventcore-fs = "1.0.1"
eventcore-types = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = "1"

[[bin]]
name = "tiber"
path = "src/main.rs"
