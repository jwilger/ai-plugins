[package]
name = "development-discipline-mcp"
version = "0.18.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
eventcore = "1.0.2"
eventcore-sqlite = "1.0.2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
toml = "0.8"

[[bin]]
name = "development-discipline-mcp"
path = "src/main.rs"

[dev-dependencies]
libc = "0.2.189"
tempfile = "3"
