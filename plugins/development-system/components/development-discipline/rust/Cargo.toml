[package]
name = "development-discipline-mcp"
version = "0.21.2"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
eventcore = "1.0.1"
eventcore-fs = "1.0.1"
eventcore-types = "1.0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[bin]]
name = "development-discipline-mcp"
path = "src/main.rs"
