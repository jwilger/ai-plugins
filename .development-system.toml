schema_version = 3

[commands.just-pre-commit]
argv = ["nix", "develop", "-c", "just", "pre-commit"]
capability = "verification"
network = "denied"

[delivery]
mode = "direct-to-trunk"
trunk_branch = "main"

[features]
agentic_systems = true
eval_case_reporting = true
tiber = true

[final_review.models]
lens_review = "substantive-worker"
post_filter = "bounded-helper"
pre_filter = "strong-reviewer"
verifier = "strong-reviewer"

[final_review.models.codex]
lens_review = "gpt-6.1-sol"
post_filter = "gpt-6-luna"
pre_filter = "gpt-6-astra"
verifier = "gpt-6-astra"

[scopes.build_output]
category = "build_output"
include = ["target/**", "dist/**", "build/**", ".evals/**"]

[scopes.developer_environment]
category = "developer_environment"
include = [".github/**", "scripts/**", "flake.nix", "flake.lock", "justfile", "package.json", "Cargo.toml"]

[scopes.documentation]
category = "documentation"
include = ["docs/**", "README.md", "CHANGELOG.md", "**/docs/**", "**/README.md", "**/CHANGELOG.md"]

[scopes.source]
category = "source"
include = ["src/**", "lib/**", "app/**", "**/src/**", "**/lib/**", "**/app/**"]

[scopes.tests]
category = "tests"
include = ["test/**", "tests/**", "spec/**", "specs/**", "**/test/**", "**/tests/**", "**/spec/**", "**/specs/**"]

[worktrees]
root = ".worktrees"

# Workload preferences; confirm capability and runtime support for each assignment.
[model_routing]
bounded_model = "gpt-6-luna"
bounded_ordinary_effort = "low"
standard_model = "gpt-6.1-sol"
standard_ordinary_effort = "medium"
standard_deeper_effort = "high"
strong_model = "gpt-6-astra"
strong_deeper_effort = "high"
strong_maximum_effort = "xhigh"
